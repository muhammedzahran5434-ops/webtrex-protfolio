  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========================================================================
    // FILE VALIDATION & BINARY SERIALIZATION HELPERS
    // ========================================================================
    const ALLOWED_IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'svg'];
    const ALLOWED_FILE_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'svg', 'apk', 'iso', 'pdf', 'docx', 'txt', 'zip'];

    function getFileExt(filename = '') {
      const parts = String(filename).split('.');
      return parts.length > 1 ? parts.pop().toLowerCase() : '';
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(k));
      return `${parseFloat((b / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    // ========================================================================
    // SUPABASE CLOUD CONFIGURATION
    // ========================================================================


    const isSupabaseConfigured = () =>
      Boolean(
        window.supabase &&
        SUPABASE_CONFIG.url &&
        !SUPABASE_CONFIG.url.includes("webtrex") &&
        SUPABASE_CONFIG.anonKey &&
        !SUPABASE_CONFIG.anonKey.includes("sb_publishable_n3vdmzkxVOdRYfmygzXJMQ_qZ9e5YHy")
      );

    const supabaseClient = isSupabaseConfigured()
      ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey)
      : null;

    // ========================================================================
    // WEBTREX CLOUD DATABASE & STORAGE ENGINE (SUPABASE + LOCAL FALLBACK)
    // ========================================================================
    const DB_NAME = 'WebTrexCloudDB';

    const WebTrexDB = (() => {
      const cache = new Map();
      let hydrated = false;
      let cloudStatus = supabaseClient ? 'connecting' : 'unconfigured';

      function getCloudStatus() {
        return cloudStatus;
      }

      async function uploadBinaryToCloud(fileObj) {
        if (!supabaseClient || !fileObj?.dataUrl || !fileObj.dataUrl.startsWith('data:')) {
          return fileObj;
        }
        try {
          const res = await fetch(fileObj.dataUrl);
          const blob = await res.blob();
          const safeName = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${(fileObj.name || 'asset').replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const filePath = `releases/${safeName}`;

          const { error: uploadError } = await supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .upload(filePath, blob, {
              contentType: blob.type || 'application/octet-stream',
              upsert: true,
            });

          if (uploadError) {
            console.warn('Supabase Storage upload warning (falling back to inline):', uploadError.message);
            return fileObj;
          }

          const { data: publicData } = supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .getPublicUrl(filePath);

          if (publicData?.publicUrl) {
            return {
              ...fileObj,
              dataUrl: publicData.publicUrl,
              storagePath: filePath,
              cloudHosted: true,
            };
          }
        } catch (err) {
          console.warn('Binary upload fallback:', err);
        }
        return fileObj;
      }

      async function uploadDataUrlImageToCloud(dataUrl, label = 'image') {
        if (!supabaseClient || !dataUrl || !dataUrl.startsWith('data:image/')) {
          return dataUrl;
        }
        if (dataUrl.startsWith('data:image/svg+xml')) {
          return dataUrl;
        }
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
          const filePath = `images/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${label}.${ext}`;

          const { error } = await supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .upload(filePath, blob, {
              contentType: blob.type,
              upsert: true,
            });

          if (!error) {
            const { data } = supabaseClient.storage
              .from(SUPABASE_CONFIG.storageBucket)
              .getPublicUrl(filePath);
            if (data?.publicUrl) return data.publicUrl;
          }
        } catch (err) {
          console.warn('Image upload fallback:', err);
        }
        return dataUrl;
      }

      async function hydrate() {
        if (!supabaseClient) {
          cloudStatus = 'unconfigured';
          hydrated = true;
          return;
        }
        try {
          const { data, error } = await supabaseClient
            .from(SUPABASE_CONFIG.tableName)
            .select('key, value');

          if (error) {
            console.warn('Supabase read error:', error.message);
            cloudStatus = 'error';
            hydrated = true;
            return;
          }

          (data || []).forEach((row) => {
            cache.set(row.key, row.value);
            try {
              localStorage.setItem(row.key, JSON.stringify(row.value));
            } catch (e) {}
          });

          cloudStatus = 'connected';
          hydrated = true;
          window.dispatchEvent(new CustomEvent('webtrex_storage_sync', { detail: { key: 'ALL_HYDRATED' } }));
        } catch (e) {
          cloudStatus = 'error';
          hydrated = true;
        }
      }

      function subscribeRealtime() {
        if (!supabaseClient) return null;
        const channel = supabaseClient
          .channel('webtrex-realtime-sync')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: SUPABASE_CONFIG.tableName },
            (payload) => {
              if (payload?.new?.key) {
                cache.set(payload.new.key, payload.new.value);
                try {
                  localStorage.setItem(payload.new.key, JSON.stringify(payload.new.value));
                } catch (e) {}
                window.dispatchEvent(
                  new CustomEvent('webtrex_storage_sync', { detail: { key: payload.new.key } })
                );
              }
            }
          )
          .subscribe();
        return channel;
      }

      async function persistToCloud(key, value) {
        if (!supabaseClient) return false;
        try {
          const { error } = await supabaseClient
            .from(SUPABASE_CONFIG.tableName)
            .upsert(
              { key, value, updated_at: new Date().toISOString() },
              { onConflict: 'key' }
            );
          if (error) {
            console.error('Supabase upsert error:', error.message);
            cloudStatus = 'error';
            return false;
          }
          cloudStatus = 'connected';
          return true;
        } catch (e) {
          cloudStatus = 'error';
          return false;
        }
      }

      async function exportBackupJson() {
        await hydrate();
        const dump = {
          database: DB_NAME,
          exportedAt: new Date().toISOString(),
          collections: {},
        };
        Object.values(STORAGE_KEYS).forEach((k) => {
          if (k !== STORAGE_KEYS.ADMIN) {
            dump.collections[k] = Store.read(k, null);
          }
        });
        return JSON.stringify(dump, null, 2);
      }

      async function importBackupJson(jsonString) {
        const parsed = JSON.parse(jsonString);
        const cols = parsed?.collections || parsed;
        if (!cols || typeof cols !== 'object') {
          throw new Error('Invalid WebTrex database backup format.');
        }
        for (const [key, val] of Object.entries(cols)) {
          if (Object.values(STORAGE_KEYS).includes(key) && key !== STORAGE_KEYS.ADMIN && val !== null) {
            Store.write(key, val);
          }
        }
      }

      return {
        hydrate,
        subscribeRealtime,
        persistToCloud,
        uploadBinaryToCloud,
        uploadDataUrlImageToCloud,
        exportBackupJson,
        importBackupJson,
        getCloudStatus,
        getCache: (key) => cache.get(key),
        hasCache: (key) => cache.has(key),
        setCache: (key, val) => cache.set(key, val),
        isHydrated: () => hydrated,
      };
    })();

    // ========================================================================
    // CRYPTOGRAPHIC SHA-256 HASHING & DYNAMIC DEFAULT CREDENTIAL VERIFICATION
    // ========================================================================
    const INITIAL_ADMIN_EMAIL = 'webtrex@gmail.com';
    const HASH_SALT_PREFIX = 'WEBTREX_CORE_SALT_2026_V1::';

    function sha256PureJs(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};

      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;

      for (let j = 0; j < words.length; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = hash[0];
          const e = hash[4];
          const temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                  0);
          const temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (let i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }

      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    function utf8Encode(str) {
      return unescape(encodeURIComponent(str));
    }

    async function computeSaltedHash(plainText, customSalt = null) {
      const normalized = String(plainText || '');
      const payload = customSalt
        ? `${customSalt}::${normalized}`
        : `${HASH_SALT_PREFIX}${normalized}`;
      try {
        if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
          const encoder = new TextEncoder();
          const data = encoder.encode(payload);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (err) {}
      return sha256PureJs(utf8Encode(payload));
    }

    async function getExpectedDefaultHash() {
      const defaultSeed = String.fromCharCode(64, 122, 97, 104, 114, 97, 110, 53, 52, 51, 52);
      return computeSaltedHash(defaultSeed);
    }

    // ========================================================================
    // HYBRID SUPABASE + LOCALSTORAGE PERSISTENCE ADAPTER
    // ========================================================================
    const STORAGE_KEYS = {
      PROJECTS: 'webtrex_cms_projects_v1',
      CATEGORIES: 'webtrex_cms_categories_v1',
      FILES: 'webtrex_cms_files_v1',
      MESSAGES: 'webtrex_cms_messages_v1',
      LOGS: 'webtrex_cms_logs_v1',
      SETTINGS: 'webtrex_cms_settings_v1',
      ADMIN: 'webtrex_cms_admin_v1',
    };

    const Store = {
      has(key) {
        if (WebTrexDB.hasCache(key)) return true;
        try {
          return localStorage.getItem(key) !== null;
        } catch (e) {
          return false;
        }
      },
      read(key, fallback) {
        if (WebTrexDB.hasCache(key)) {
          return WebTrexDB.getCache(key);
        }
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            WebTrexDB.setCache(key, parsed);
            return parsed;
          }
          return fallback;
        } catch (e) {
          return fallback;
        }
      },
      write(key, value) {
        WebTrexDB.setCache(key, value);
        WebTrexDB.persistToCloud(key, value);
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('webtrex_storage_sync', { detail: { key } }));
      },
    };

    // ========================================================================
    // SMOOTH REVEAL ON SCROLL
    // ========================================================================
    function RevealBlock({ children, className = '', delay = 0 }) {
      const [shown, setShown] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setShown(true);
              obs.disconnect();
            }
          },
          { threshold: 0.06 }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`transition-all duration-700 ease-out ${
            shown ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'
          } ${className}`}
        >
          {children}
        </div>
      );
    }

                  <span className="text-indigo-400">◆</span>
                  <span>APK & ISO Distributions</span>
                  <span className="text-cyan-400">◆</span>

                    WebTrex is an independent digital product studio uniting precision interface design with resilient full-stack engineering.
                  </p>

                <div className="grid md:grid-cols-3 gap-5">
                  {[
                    {
                      code: '01',
                      title: 'Signal Over Noise',
                      desc: 'Every interface element earns its place through crisp hierarchy, intentional motion, and zero clutter.',
                      accent: 'from-cyan-500/15 to-transparent border-cyan-500/20',

                      <Search className="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={portfolioSearch}
                        onChange={(e) => setPortfolioSearch(e.target.value)}

                        <button

                        title="Grid View"
                      >
                        <LayoutGrid className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => setPortfolioViewMode('list')}
                        className={`p-2 rounded-lg transition-colors ${
                          portfolioViewMode === 'list'
                            ? 'bg-cyan-400 text-slate-950'
                            : 'text-slate-400 hover:text-white'

                    { label: 'Mobile Apps', value: 'Mobile Application' },
                    { label: 'Software', value: 'Software' },
                    { label: 'UI/UX Design', value: 'UI/UX Design' },
                    { label: 'Graphics', value: 'Image / Graphics' },
                    { label: 'APK Packages', value: 'APK' },

                            ? 'bg-white text-slate-950 shadow-sm'

              {filteredPublicProjects.length === 0 ? (
                <div className="rounded-3xl border border-dashed border-white/15 p-16 text-center bg-[#0B0E14]">

                      ? 'The release vault is ready.'
                      : 'No matching releases found.'}

                  <p className="text-sm text-slate-400 mt-2 max-w-md mx-auto">
                    {publishedProjects.length === 0
                      ? 'Log in to the Admin Console to publish websites, mobile apps, APKs, ISOs, or software suites.'

                  </p>
                  {(selectedCategoryFilter !== 'All' || portfolioSearch.trim() !== '') && (
                    <button
                      onClick={() => {
                        setSelectedCategoryFilter('All');

                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredPublicProjects.map((project, idx) => {
                    const hasDownloads =
                      (project.files && project.files.length > 0) || Boolean(project.downloadUrl);

                    return (
                      <RevealBlock key={project.id} delay={idx * 45}>
                        <article className="group bento-card rounded-3xl overflow-hidden flex flex-col justify-between h-full">
                          <div>
                            <div
                              onClick={() => {
                                setActiveProjectModal(project);
                                setActiveGalleryIdx(0);
                              }}
                              className="aspect-[16/10] bg-[#080A0F] overflow-hidden relative cursor-pointer border-b border-white/10"
                            >
                              <img
                                src={project.thumbnail}
                                alt={project.title}
                                className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"

                                <span className="px-2.5 py-1 rounded-lg bg-slate-950/80 backdrop-blur-md text-[11px] font-mono font-semibold text-cyan-300 border border-white/15">
                                  {project.category}
                                </span>
                              </div>
                              {project.date && (
                                <span className="absolute bottom-3 right-3 px-2 py-0.5 rounded bg-slate-950/80 text-slate-300 text-[10px] font-mono border border-white/10">
                                  {project.date}
                                </span>
                              )}
                            </div>

                            <div className="p-6">
                              <h3
                                onClick={() => {
                                  setActiveProjectModal(project);
                                  setActiveGalleryIdx(0);
                                }}
                                className="text-xl font-display font-bold text-white cursor-pointer group-hover:text-cyan-300 transition-colors"
                              >
                                {project.title}
                              </h3>
                              <p className="text-sm text-slate-400 mt-2 line-clamp-3 leading-relaxed">
                                {project.description}
                              </p>

                              {project.technologies && project.technologies.length > 0 && (
                                <div className="flex flex-wrap gap-1.5 mt-4">
                                  {project.technologies.slice(0, 4).map((tech) => (
                                    <span
                                      key={tech}
                                      className="px-2.5 py-0.5 rounded-md bg-white/[0.04] border border-white/10 text-[11px] font-mono text-slate-300"
                                    >
                                      {tech}
                                    </span>
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>

                          <div className="px-6 pb-5 pt-4 border-t border-white/10 flex items-center justify-between gap-3">
                            <button
                              onClick={() => {
                                setActiveProjectModal(project);
                                setActiveGalleryIdx(0);
                              }}
                              className="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-200 hover:text-cyan-300 transition-colors"
                            >
                              Inspect Case Study
                              <ArrowUpRight className="w-4 h-4" />
                            </button>

                            {hasDownloads && (
                              <button
                                onClick={() => {
                                  if (project.files && project.files.length > 0) {
                                    triggerFileDownload(project.files[0]);
                                  } else if (project.downloadUrl) {
                                    window.open(project.downloadUrl, '_blank', 'noopener,noreferrer');
                                  }
                                }}
                                className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-cyan-400/15 border border-cyan-400/30 text-cyan-300 text-xs font-bold hover:bg-cyan-400 hover:text-slate-950 transition-colors"
                              >
                                <Download className="w-3.5 h-3.5" />
                                Get Build
                              </button>
                            )}
                          </div>
                        </article>
                      </RevealBlock>
                    );
                  })}
                </div>
              ) : (
                /* COMPACT TECHNICAL INDEX LIST VIEW */
                <div className="bento-card rounded-3xl overflow-hidden divide-y divide-white/10">
                  {filteredPublicProjects.map((project) => {
                    const hasDownloads =
                      (project.files && project.files.length > 0) || Boolean(project.downloadUrl);
                    return (
                      <div
                        key={project.id}
                        className="p-5 sm:px-7 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-white/[0.025] transition-colors"
                      >
                        <div
                          onClick={() => {
                            setActiveProjectModal(project);
                            setActiveGalleryIdx(0);
                          }}
                          className="flex items-center gap-4 cursor-pointer min-w-0 flex-1"
                        >
                          <img
                            src={project.thumbnail}
                            alt=""
                            className="w-16 h-12 rounded-xl object-cover border border-white/10 shrink-0"
                          />
                          <div className="min-w-0">
                            <div className="flex items-center gap-2.5 flex-wrap">
                              <h3 className="font-display font-bold text-white hover:text-cyan-300 transition-colors">
                                {project.title}
                              </h3>
                              <span className="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-400/20 text-[10px] font-mono text-cyan-300">
                                {project.category}
                              </span>
                            </div>
                            <p className="text-xs text-slate-400 truncate mt-1 max-w-xl">
                              {project.description}
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center gap-3 shrink-0">
                          {project.date && (
                            <span className="text-xs font-mono text-slate-500 hidden sm:inline">
                              {project.date}
                            </span>
                          )}
                          <button
                            onClick={() => {
                              setActiveProjectModal(project);
                              setActiveGalleryIdx(0);
                            }}
                            className="px-3.5 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-white hover:border-cyan-400/40"
                          >
                            Inspect
                          </button>
                          {hasDownloads && (
                            <button
                              onClick={() => {
                                if (project.files && project.files.length > 0) {
                                  triggerFileDownload(project.files[0]);
                                } else if (project.downloadUrl) {
                                  window.open(project.downloadUrl, '_blank', 'noopener,noreferrer');
                                }
                              }}
                              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-cyan-400 text-slate-950 text-xs font-bold hover:bg-cyan-300"
                            >
                              <Download className="w-3.5 h-3.5" />
                              Download
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          {/* INTERACTIVE 4-STAGE PIPELINE STEPPER */}
          <section id="process" className="py-20 sm:py-28 bg-[#090B10] border-b border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <RevealBlock>
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
                  <div>
                    <span className="text-xs font-mono font-semibold uppercase tracking-[0.2em] text-cyan-400">
                      04 // EXECUTION PIPELINE
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-display font-bold text-white mt-2">
                      How We Ship
                    </h2>
                  </div>
                  <p className="text-slate-400 max-w-md text-sm">
                    Four transparent phases engineered to take ideas from whiteboard to production.
                  </p>
                </div>

                {/* Progress Bar Tabs */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                  {processStages.map((stage, idx) => {
                    const active = activeProcessStep === idx;
                    return (
                      <button
                        key={stage.step}
                        onClick={() => setActiveProcessStep(idx)}
                        className={`text-left p-5 rounded-2xl border transition-all ${
                          active
                            ? 'bg-white/[0.06] border-cyan-400/50 shadow-lg'
                            : 'bg-[#0D1017] border-white/10 hover:border-white/25'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-3">
                          <span className={`font-mono text-xs font-bold ${active ? 'text-cyan-300' : 'text-slate-500'}`}>
                            PHASE {stage.step}
                          </span>
                          <span className="text-[11px] font-mono text-slate-500">{stage.duration}</span>
                        </div>
                        <p className="text-xl font-display font-bold text-white">{stage.title}</p>
                        <p className="text-xs text-slate-400 mt-0.5">{stage.subtitle}</p>
                        <div className="h-1 w-full rounded-full bg-white/10 mt-4 overflow-hidden">
                          <div
                            className={`h-full rounded-full transition-all duration-500 ${
                              active ? 'w-full bg-gradient-to-r from-cyan-400 to-indigo-500' : 'w-0'
                            }`}
                          />
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* Active Stage Detail Card */}
                {(() => {
                  const stage = processStages[activeProcessStep] || processStages[0];
                  return (
                    <div
                      key={stage.step}
                      className="bento-card rounded-3xl p-7 sm:p-9 grid md:grid-cols-12 gap-8 items-center animate-fade-in"
                    >
                      <div className="md:col-span-7 space-y-3">
                        <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest">
                          STAGE {stage.step} — {stage.subtitle}
                        </span>
                        <h3 className="text-2xl sm:text-3xl font-display font-bold text-white">
                          {stage.title}
                        </h3>
                        <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                          {stage.desc}
                        </p>
                      </div>
                      <div className="md:col-span-5 space-y-2.5">
                        <p className="text-[11px] font-mono uppercase tracking-wider text-slate-500">
                          Stage Outputs
                        </p>
                        {stage.outputs.map((out) => (
                          <div
                            key={out}
                            className="flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-xs font-medium text-slate-200"
                          >
                            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" />
                            {out}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </RevealBlock>
            </div>
          </section>

          {/* CONTACT & PROJECT BRIEF HUB */}

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid lg:grid-cols-12 gap-10 lg:gap-12">
                <div className="lg:col-span-5 space-y-6">
                  <div>
                    <span className="text-xs font-mono font-semibold uppercase tracking-[0.2em] text-cyan-400">
                      05 // INITIATE CONTACT
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-display font-bold text-white mt-2 leading-tight">
                      Let’s build your next release.
                    </h2>
                    <p className="text-slate-400 mt-4 text-sm sm:text-base leading-relaxed">
                      Share your product goals, timeline, or technical questions. Our leads respond directly within 24 hours.
                    </p>

                    <div className="flex items-center justify-between gap-3 p-4 rounded-2xl bg-[#0D1017] border border-white/10">
                      <a href={`mailto:${settings.email}`} className="flex items-center gap-3.5 min-w-0">
                        <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-400/25 text-cyan-300 flex items-center justify-center shrink-0">
                          <Mail className="w-4 h-4" />
                        </div>
                        <div className="min-w-0">
                          <p className="text-[11px] font-mono text-slate-500">EMAIL</p>
                          <p className="text-sm font-semibold text-white truncate">{settings.email}</p>
                        </div>
                      </a>
                      <button
                        onClick={() => copyToClipboard(settings.email, 'Email')}
                        className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 shrink-0"
                        title="Copy Email"
                      >
                        {copiedField === 'Email' ? (
                          <Check className="w-4 h-4 text-emerald-400" />
                        ) : (
                          <Copy className="w-4 h-4" />
                        )}
                      </button>
                    </div>

                    <div className="flex items-center justify-between gap-3 p-4 rounded-2xl bg-[#0D1017] border border-white/10">
                      <div className="flex items-center gap-3.5 min-w-0">
                        <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-400/25 text-indigo-300 flex items-center justify-center shrink-0">
                          <Phone className="w-4 h-4" />
                        </div>
                        <div>
                          <p className="text-[11px] font-mono text-slate-500">TELEPHONE</p>
                          <p className="text-sm font-semibold text-white">{settings.phone}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(settings.phone, 'Phone')}
                        className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 shrink-0"

                      >
                        {copiedField === 'Phone' ? (
                          <Check className="w-4 h-4 text-emerald-400" />
                        ) : (
                          <Copy className="w-4 h-4" />
                        )}
                      </button>
                    </div>

                    <div className="flex items-center gap-3.5 p-4 rounded-2xl bg-[#0D1017] border border-white/10">
                      <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-400/25 text-emerald-300 flex items-center justify-center shrink-0">
                        <MapPin className="w-4 h-4" />
                      </div>
                      <div>
                        <p className="text-[11px] font-mono text-slate-500">STUDIOS</p>
                        <p className="text-sm font-semibold text-white">{settings.location}</p>
                      </div>
                    </div>
                  </div>

                  <div className="pt-2 flex flex-wrap gap-2">
                    {[
                      { label: 'GitHub', url: settings.githubUrl || 'https://github.com/muhammedzahran5434-ops' },
                      { label: 'LinkedIn', url: settings.linkedinUrl || 'https://www.linkedin.com/in/muhammed-zahran-b8b111406' },
                      { label: 'Pinterest', url: settings.pinterestUrl || 'https://in.pinterest.com/webtrex/' },
                    ].map((s) => (
                      <a
                        key={s.label}
                        href={s.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-xs font-semibold text-slate-200 hover:border-cyan-400/50 hover:text-cyan-300 transition-colors"
                      >
                        {s.label}
                        <ArrowUpRight className="w-3.5 h-3.5" />
                      </a>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-7">
                  <PublicContactForm
                    addToast={addToast}
                    recordActivity={recordActivity}
                    preselectedDiscipline={preselectedDiscipline}
                  />
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#080A0F] border-t border-white/10 pt-16 pb-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid md:grid-cols-12 gap-10 pb-12 border-b border-white/10">
                <div className="md:col-span-5 space-y-4">
                  <WebTrexLogo />
                  <p className="text-slate-400 text-sm max-w-sm leading-relaxed">
                    {settings.tagline} Engineering websites, mobile apps, and bespoke software systems.
                  </p>
                  <a
                    href={`mailto:${settings.email}`}
                    className="inline-flex items-center gap-2 text-sm font-semibold text-cyan-300 hover:underline"
                  >
                    <Mail className="w-4 h-4" />
                    {settings.email}
                  </a>
                </div>

                <div className="md:col-span-3 space-y-2.5">
                  <p className="text-[11px] font-mono uppercase tracking-widest text-slate-500">
                    Navigation

                  <ul className="space-y-2 text-sm text-slate-400">
                    {navLinks.map((l) => (
                      <li key={l.id}>
                        <a href={l.href} className="hover:text-white transition-colors">
                          {l.label}
                        </a>
                      </li>

                  </ul>
                </div>

                <div className="md:col-span-4 space-y-3">
                  <p className="text-[11px] font-mono uppercase tracking-widest text-slate-500">
                    Studio Access
                  </p>
                  <p className="text-sm text-slate-400">
                    Manage releases, binary packages, and client inquiries from the console.
                  </p>
                  <button
                    onClick={() => (adminSession ? navigateToAdmin() : setSignInModalOpen(true))}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-xs font-bold text-white hover:border-cyan-400/40 transition-colors"
                  >
                    <Lock className="w-3.5 h-3.5 text-cyan-400" />
                    {adminSession ? 'Open Admin Console' : 'Administrator Portal'}
                  </button>
                </div>
              </div>

              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                <p>© {new Date().getFullYear()} WEBTREX Technologies. All rights reserved.</p>

                  </button>
                </div>
              </div>

          {/* SLIDE-OVER CASE STUDY DRAWER */}
          {activeProjectModal && (
            <div
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-end"
              onClick={() => setActiveProjectModal(null)}
            >
              <div
                className="bg-[#0B0E14] border-l border-white/15 max-w-2xl w-full h-full flex flex-col shadow-2xl animate-slide-in-right"

              >
                <div className="px-6 py-5 border-b border-white/10 flex items-center justify-between bg-[#080A0F]">
                  <div className="flex items-center gap-3">
                    <span className="px-2.5 py-1 rounded-lg bg-cyan-500/10 border border-cyan-400/25 text-cyan-300 text-xs font-mono font-semibold">
                      {activeProjectModal.category}
                    </span>
                    {activeProjectModal.date && (
                      <span className="text-xs text-slate-400 font-mono">
                        {activeProjectModal.date}
                      </span>
                    )}
                  </div>
                  <button
                    onClick={() => setActiveProjectModal(null)}
                    className="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 sm:p-8 flex-1 overflow-y-auto space-y-7">
                  {(() => {
                    const gallery =
                      activeProjectModal.images && activeProjectModal.images.length > 0

                        : [activeProjectModal.thumbnail];
                    return (
                      <div className="space-y-3">
                        <div className="aspect-[16/9] rounded-2xl overflow-hidden bg-[#06070A] border border-white/10">
                          <img
                            src={gallery[activeGalleryIdx] || activeProjectModal.thumbnail}
                            alt={activeProjectModal.title}
                            className="w-full h-full object-cover"
                          />

                        {gallery.length > 1 && (
                          <div className="flex gap-2.5 overflow-x-auto pb-1">

                            ))}

                  <div>
                    <h2 className="text-2xl sm:text-3xl font-display font-bold text-white">
                      {activeProjectModal.title}

                    <p className="text-slate-300 mt-3 text-sm sm:text-base leading-relaxed whitespace-pre-line">
                      {activeProjectModal.description}
                    </p>
                  </div>

                  {activeProjectModal.technologies && activeProjectModal.technologies.length > 0 && (
                    <div>
                      <p className="text-[11px] font-mono uppercase tracking-wider text-slate-500 mb-2.5">
                        Technologies & Stack
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {activeProjectModal.technologies.map((tech) => (
                          <span
                            key={tech}
                            className="px-3 py-1 rounded-lg bg-white/[0.04] border border-white/10 text-xs font-mono text-slate-200"
                          >
                            {tech}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {activeProjectModal.files && activeProjectModal.files.length > 0 && (
                    <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10 space-y-3">
                      <p className="text-[11px] font-mono uppercase tracking-wider text-cyan-300">
                        Release Packages ({activeProjectModal.files.length})
                      </p>

                        {activeProjectModal.files.map((file, idx) => (

                            key={file.id || idx}

                            <div className="flex items-center gap-3 min-w-0">
                              <span className="px-2 py-1 rounded bg-cyan-500/15 border border-cyan-400/25 text-cyan-300 text-[10px] font-mono font-bold uppercase">

                              <div className="min-w-0">
                                <p className="text-sm font-semibold text-white truncate">

                                </p>
                                <p className="text-xs font-mono text-slate-500">
                                  {formatBytes(file.size)}
                                </p>

                              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-cyan-400 text-slate-950 text-xs font-bold hover:bg-cyan-300 transition-colors shrink-0"
                            >
                              <Download className="w-3.5 h-3.5" />
                              Download
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="flex flex-wrap items-center gap-3 pt-2">
                    {activeProjectModal.websiteUrl && (
                      <a
                        href={activeProjectModal.websiteUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-white text-slate-950 text-sm font-bold hover:bg-cyan-300 transition-colors"
                      >
                        <ExternalLink className="w-4 h-4" />
                        Launch Live Site
                      </a>
                    )}
                    {activeProjectModal.downloadUrl && (
                      <a
                        href={activeProjectModal.downloadUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm font-semibold hover:border-cyan-400/50 transition-colors"
                      >
                        <Download className="w-4 h-4" />
                        External Download
                      </a>
                    )}
                  </div>

              </div>

          {/* QUICK COMMAND PALETTE (⌘K) */}
          {commandPaletteOpen && (
            <CommandPaletteModal
              projects={publishedProjects}
              settings={settings}
              adminSession={adminSession}
              onClose={() => setCommandPaletteOpen(false)}
              onSelectProject={(proj) => {
                setCommandPaletteOpen(false);
                setActiveProjectModal(proj);
                setActiveGalleryIdx(0);
              }}
              onNavigateSection={(secId) => {
                setCommandPaletteOpen(false);
                const el = document.getElementById(secId);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
              onOpenAuth={() => {
                setCommandPaletteOpen(false);
                if (adminSession) navigateToAdmin();
                else setSignInModalOpen(true);
              }}
              onCopyEmail={() => {
                copyToClipboard(settings.email, 'Email');
                setCommandPaletteOpen(false);
              }}
            />
          )}

          {/* SIGN IN MODAL */}
          {signInModalOpen && (
            <SignInModal
              onClose={() => setSignInModalOpen(false)}
              onAuthenticated={(sessionData) => {
                setAdminSession(sessionData);
                setSignInModalOpen(false);
                setCurrentRoute('admin');
                addToast('Welcome Back', `Signed in as ${sessionData.email}`);
              }}
            />
          )}

          {/* LEGAL MODAL */}
          {legalModal && (
            <div
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setLegalModal(null)}
            >
              <div
                className="bg-[#0E1118] rounded-3xl border border-white/15 max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-4 animate-fade-in"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-xl font-display font-bold text-white">
                    {legalModal === 'privacy' ? 'Privacy Policy' : 'Terms and Conditions'}
                  </h3>
                  <button
                    onClick={() => setLegalModal(null)}
                    className="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="text-sm text-slate-300 space-y-3 max-h-[60vh] overflow-y-auto leading-relaxed">
                  {legalModal === 'privacy' ? (
                    <>
                      <p>
                        <strong className="text-white">1. Information We Collect:</strong> When you submit an inquiry via the WebTrex contact portal, we collect your name, email address, project discipline, and message details solely for project consultation.
                      </p>
                      <p>
                        <strong className="text-white">2. Security & Storage:</strong> All inquiry submissions and administrative records are stored securely. We never sell or rent visitor information to third parties.
                      </p>
                      <p>
                        <strong className="text-white">3. Contact:</strong> For data access or deletion requests, reach out at {settings.email}.
                      </p>
                    </>
                  ) : (
                    <>
                      <p>
                        <strong className="text-white">1. Intellectual Property:</strong> All visual assets, software packages, case studies, and brand marks presented on the WebTrex portfolio remain the intellectual property of WebTrex Technologies or their respective clients.
                      </p>
                      <p>
                        <strong className="text-white">2. Software & Release Downloads:</strong> Approved APK, ISO, and archive artifacts provided in the portfolio are intended for authorized evaluation and deployment in accordance with each project’s license.
                      </p>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // COMMAND PALETTE MODAL (⌘K)
    // ========================================================================
    function CommandPaletteModal({
      projects,
      adminSession,
      onClose,
      onSelectProject,
      onNavigateSection,
      onOpenAuth,
      onCopyEmail,
    }) {
      const [query, setQuery] = useState('');
      const inputRef = useRef(null);

      useEffect(() => {
        inputRef.current?.focus();
      }, []);

      const q = query.trim().toLowerCase();

      const quickCommands = [
        { id: 'cmd-home', label: 'Jump to Overview', hint: 'Section', action: () => onNavigateSection('home') },
        { id: 'cmd-services', label: 'Explore Capabilities Matrix', hint: 'Section', action: () => onNavigateSection('services') },
        { id: 'cmd-projects', label: 'Browse All Releases', hint: 'Section', action: () => onNavigateSection('projects') },
        { id: 'cmd-contact', label: 'Start a Project Inquiry', hint: 'Section', action: () => onNavigateSection('contact') },
        { id: 'cmd-copy', label: 'Copy Studio Email Address', hint: 'Action', action: onCopyEmail },
        {
          id: 'cmd-auth',
          label: adminSession ? 'Open Admin Console' : 'Administrator Sign In',
          hint: 'Auth',
          action: onOpenAuth,
        },
      ].filter((c) => !q || c.label.toLowerCase().includes(q));

      const matchedProjects = projects
        .filter(
          (p) =>
            !q ||
            p.title?.toLowerCase().includes(q) ||
            p.category?.toLowerCase().includes(q) ||
            (p.technologies || []).some((t) => t.toLowerCase().includes(q))
        )
        .slice(0, 5);

      return (
        <div
          className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-start justify-center pt-20 px-4"
          onClick={onClose}
        >
          <div
            className="bg-[#0D1017] border border-white/15 rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden animate-fade-in"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center gap-3 px-4 py-3.5 border-b border-white/10">
              <Search className="w-4 h-4 text-cyan-400 shrink-0" />
              <input
                ref={inputRef}
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Type a command or search releases (APK, Website, React...)"
                className="w-full bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none"
              />
              <kbd className="px-2 py-0.5 rounded bg-white/10 text-[10px] font-mono text-slate-400">
                ESC
              </kbd>
            </div>

            <div className="max-h-96 overflow-y-auto p-2 space-y-3">
              {matchedProjects.length > 0 && (
                <div>
                  <p className="px-3 py-1.5 text-[10px] font-mono uppercase tracking-wider text-slate-500">
                    Published Releases
                  </p>
                  {matchedProjects.map((p) => (
                    <button
                      key={p.id}
                      onClick={() => onSelectProject(p)}
                      className="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl hover:bg-white/[0.06] text-left transition-colors"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <img src={p.thumbnail} alt="" className="w-8 h-6 rounded object-cover border border-white/10" />
                        <span className="text-sm font-medium text-white truncate">{p.title}</span>
                      </div>
                      <span className="text-[11px] font-mono text-cyan-300 shrink-0">{p.category}</span>
                    </button>
                  ))}
                </div>
              )}

              <div>
                <p className="px-3 py-1.5 text-[10px] font-mono uppercase tracking-wider text-slate-500">
                  Quick Navigation & Actions
                </p>
                {quickCommands.map((cmd) => (
                  <button
                    key={cmd.id}
                    onClick={cmd.action}
                    className="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl hover:bg-white/[0.06] text-left transition-colors"
                  >
                    <span className="text-sm text-slate-200">{cmd.label}</span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/5 text-slate-400">
                      {cmd.hint}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // TOAST NOTIFICATION CONTAINER
    // ========================================================================
    function ToastContainer({ toasts }) {
      if (toasts.length === 0) return null;
      return (
        <div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
          {toasts.map((t) => (
            <div
              key={t.id}
              className="pointer-events-auto bg-[#0E1118]/95 backdrop-blur-xl text-white rounded-2xl p-4 shadow-2xl border border-white/15 flex items-start gap-3 animate-fade-in"
            >
              {t.type === 'error' ? (
                <AlertCircle className="w-5 h-5 text-rose-400 shrink-0 mt-0.5" />
              ) : (
                <CheckCircle2 className="w-5 h-5 text-cyan-400 shrink-0 mt-0.5" />
              )}
              <div className="min-w-0">
                <p className="text-sm font-bold">{t.title}</p>
                {t.message && <p className="text-xs text-slate-400 mt-0.5">{t.message}</p>}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ========================================================================
    // SIGN IN MODAL COMPONENT
    // ========================================================================
    function SignInModal({ onClose, onAuthenticated }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const cleanEmail = email.trim().toLowerCase();
          const cleanPassword = password.trim();
          const computedHash = await computeSaltedHash(cleanPassword);
          const expectedDefaultHash = await getExpectedDefaultHash();

          const storedAdmin = Store.read(STORAGE_KEYS.ADMIN, null);
          let valid = false;
          let adminProfile = {
            email: cleanEmail || INITIAL_ADMIN_EMAIL,
            name: storedAdmin?.name || 'WebTrex Lead Administrator',
            role: storedAdmin?.role || 'Super Administrator',
          };

          if (storedAdmin && storedAdmin.passwordUpdatedAt) {
            const storedEmail = String(storedAdmin.email || INITIAL_ADMIN_EMAIL).trim().toLowerCase();
            const rotatedHash = storedAdmin.salt
              ? await computeSaltedHash(cleanPassword, storedAdmin.salt)
              : computedHash;
            valid = cleanEmail === storedEmail && rotatedHash === storedAdmin.passwordHash;
            adminProfile.email = storedEmail;
          } else {
            valid = cleanEmail === INITIAL_ADMIN_EMAIL && computedHash === expectedDefaultHash;
          }

          if (valid) {
            setEmail('');
            setPassword('');
            onAuthenticated(adminProfile);
          } else {
            setErrorMsg('Invalid administrator email or password. Access denied.');
          }
        } catch (err) {
          setErrorMsg('Authentication error occurred. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={onClose}
        >
          <div
            className="bg-[#0D1017] rounded-3xl border border-white/15 max-w-md w-full p-7 sm:p-9 shadow-2xl relative animate-fade-in"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
              aria-label="Close Sign In Modal"
            >
              <X className="w-5 h-5" />
            </button>

            <div className="mb-7">
              <WebTrexLogo />
              <h2 className="text-2xl font-display font-bold text-white mt-6">
                Console Authentication
              </h2>
              <p className="text-sm text-slate-400 mt-1">
                Sign in with administrator credentials to manage releases, binary files, and client messages.
              </p>
            </div>

            {errorMsg && (
              <div className="mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-center gap-2.5 text-rose-300 text-xs font-medium">
                <AlertCircle className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2">
                  Admin Email
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@company.com"
                  className="w-full px-4 py-3 rounded-xl bg-[#07090D] border border-white/15 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors"
                />
              </div>

              <div>
                <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2">
                  Password
                </label>
                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full pl-4 pr-11 py-3 rounded-xl bg-[#07090D] border border-white/15 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                    aria-label="Toggle Password Visibility"
                  >
                    {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full mt-2 py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-indigo-500 text-slate-950 text-sm font-bold hover:opacity-95 transition-opacity flex items-center justify-center gap-2 disabled:opacity-60"
              >
                {loading ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" />
                    Verifying Session...
                  </>
                ) : (
                  <>
                    <Lock className="w-4 h-4" />
                    Enter Admin Console
                  </>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================================
    // PUBLIC CONTACT FORM (WITH INTERACTIVE DISCIPLINE PILLS)
    // ========================================================================
    function PublicContactForm({ addToast, recordActivity, preselectedDiscipline }) {
      const disciplines = [
        'Website Development',
        'Mobile App Development',
        'UI/UX Design',
        'Software Development',
        'E-commerce Solutions',
        'Custom Digital Solutions',
      ];

      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [projectType, setProjectType] = useState('Website Development');
      const [message, setMessage] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (preselectedDiscipline) {
          setProjectType(preselectedDiscipline);
        }
      }, [preselectedDiscipline]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const current = Store.read(STORAGE_KEYS.MESSAGES, []);
          const newMsg = {
            id: `msg-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: name.trim(),
            email: email.trim(),
            projectType,
            message: message.trim(),
            read: false,
            createdAt: new Date().toISOString(),
          };
          Store.write(STORAGE_KEYS.MESSAGES, [newMsg, ...current]);
          recordActivity('New Inquiry Received', `${name.trim()} submitted a ${projectType} request.`);
          addToast('Brief Submitted', 'Thank you! Our team will respond within 24 hours.');
          setName('');
          setEmail('');
          setMessage('');
        } catch (err) {
          addToast('Submission Failed', 'Could not send your message. Please try again.', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <form
          onSubmit={handleSubmit}
          className="bento-card rounded-3xl p-6 sm:p-9 space-y-6"
        >
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2">
                Your Name
              </label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Alex Mercer"
                className="w-full px-4 py-3 rounded-xl bg-[#07090D] border border-white/15 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors"
              />
            </div>
            <div>
              <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2">
                Email Address
              </label>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="alex@company.com"
                className="w-full px-4 py-3 rounded-xl bg-[#07090D] border border-white/15 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors"
              />
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2.5">
              Select Discipline
            </label>
            <div className="flex flex-wrap gap-2">
              {disciplines.map((d) => {
                const active = projectType === d;
                return (
                  <button
                    key={d}
                    type="button"
                    onClick={() => setProjectType(d)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition-all ${
                      active
                        ? 'bg-cyan-400 text-slate-950 font-bold'
                        : 'bg-[#07090D] text-slate-400 border border-white/10 hover:border-white/25 hover:text-white'
                    }`}
                  >
                    {d}
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 mb-2">
              Project Brief & Target Timeline
            </label>
            <textarea
              rows={4}
              required
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              placeholder="Outline your product goals, core features, and target launch window..."
              className="w-full px-4 py-3 rounded-xl bg-[#07090D] border border-white/15 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors resize-none"
            />
          </div>

          <button
            type="submit"
            disabled={submitting}
            className="inline-flex items-center justify-center gap-2.5 px-7 py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-indigo-500 text-slate-950 text-sm font-bold hover:opacity-95 transition-opacity disabled:opacity-60"
          >
            <Send className="w-4 h-4" />
            {submitting ? 'Transmitting Brief...' : 'Submit Project Brief'}
          </button>
        </form>
      );
    }

    // ========================================================================
    // ADMIN TAB 1: OVERVIEW
    // ========================================================================
    function AdminOverviewTab({
      projects,
      uploadedFiles,
      messages,
      activityLogs,
      categories,
      onNavigateTab,
    }) {
      const publishedCount = projects.filter((p) => p.status === 'published').length;
      const draftCount = projects.filter((p) => p.status !== 'published').length;
      const unreadMessages = messages.filter((m) => !m.read).length;

      const categoryDistribution = useMemo(() => {
        return categories.map((cat) => {
          const count = projects.filter(
            (p) => p.category?.toLowerCase() === cat.name.toLowerCase()
          ).length;
          return { name: cat.name, count };
        });
      }, [categories, projects]);

      const maxCatCount = Math.max(1, ...categoryDistribution.map((c) => c.count));

      return (
        <div className="space-y-8">
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
            {[
              { label: 'Total Projects', value: projects.length, accent: 'text-white', action: 'manage-projects' },
              { label: 'Published', value: publishedCount, accent: 'text-cyan-300', action: 'manage-projects' },
              { label: 'Drafts', value: draftCount, accent: 'text-amber-300', action: 'manage-projects' },
              { label: 'Vault Files', value: uploadedFiles.length, accent: 'text-indigo-300', action: 'files' },
              {
                label: 'Messages',
                value: messages.length,
                sub: unreadMessages > 0 ? `${unreadMessages} unread` : 'All read',
                accent: 'text-emerald-300',
                action: 'messages',
              },
            ].map((stat) => (
              <div
                key={stat.label}
                onClick={() => onNavigateTab(stat.action)}
                className="cursor-pointer bento-card rounded-2xl p-5"
              >
                <p className="text-xs font-mono uppercase tracking-wider text-slate-400">{stat.label}</p>
                <p className={`text-3xl font-display font-bold mt-2 ${stat.accent}`}>
                  {stat.value}
                </p>
                {stat.sub && <p className="text-[11px] font-semibold text-cyan-300 mt-1">{stat.sub}</p>}
              </div>
            ))}
          </div>

          <div className="grid lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 bento-card rounded-3xl p-6 sm:p-7">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h3 className="text-lg font-display font-bold text-white">Category Distribution</h3>
                  <p className="text-xs text-slate-400">Live count of releases across studio disciplines</p>
                </div>
                <button
                  onClick={() => onNavigateTab('add-project')}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-400 to-indigo-500 text-slate-950 text-xs font-bold hover:opacity-95 transition-opacity"
                >
                  <PlusCircle className="w-3.5 h-3.5" />
                  New Release
                </button>
              </div>

              <div className="space-y-4">
                {categoryDistribution.map((item) => {
                  const pct = Math.round((item.count / maxCatCount) * 100);
                  return (
                    <div key={item.name} className="space-y-1.5">
                      <div className="flex items-center justify-between text-xs font-semibold">
                        <span className="text-slate-300">{item.name}</span>
                        <span className="text-cyan-300 font-mono">{item.count}</span>
                      </div>
                      <div className="h-2 w-full rounded-full bg-white/10 overflow-hidden">
                        <div
                          className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-indigo-500 transition-all duration-700"
                          style={{ width: `${Math.max(pct, item.count > 0 ? 8 : 0)}%` }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="lg:col-span-5 bento-card rounded-3xl p-6 sm:p-7">
              <div className="flex items-center gap-2 mb-6">
                <Activity className="w-4 h-4 text-cyan-400" />
                <h3 className="text-lg font-display font-bold text-white">Recent Activity</h3>
              </div>

              {activityLogs.length === 0 ? (
                <p className="text-xs text-slate-500 py-8 text-center">No activity logs recorded yet.</p>
              ) : (
                <div className="space-y-4 max-h-80 overflow-y-auto pr-1">
                  {activityLogs.slice(0, 8).map((log) => (
                    <div key={log.id} className="flex items-start gap-3 pb-3 border-b border-white/10 last:border-0">
                      <span className="w-2 h-2 rounded-full bg-cyan-400 mt-1.5 shrink-0" />
                      <div className="min-w-0 flex-1">
                        <p className="text-xs font-bold text-white">{log.action}</p>
                        <p className="text-xs text-slate-400 mt-0.5 break-words">{log.detail}</p>
                        <p className="text-[10px] font-mono text-slate-500 mt-1">
                          {new Date(log.timestamp).toLocaleString()}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 2: ADD / EDIT PROJECT FORM
    // ========================================================================
    function AdminProjectFormTab({
      categories,
      addToast,
      recordActivity,
      onSuccess,
      existingProject = null,
    }) {
      const [title, setTitle] = useState(existingProject?.title || '');
      const [description, setDescription] = useState(existingProject?.description || '');
      const [category, setCategory] = useState(
        existingProject?.category || (categories[0]?.name || 'Website')
      );
      const [thumbnail, setThumbnail] = useState(existingProject?.thumbnail || '');
      const [images, setImages] = useState(existingProject?.images || []);
      const [files, setFiles] = useState(existingProject?.files || []);
      const [websiteUrl, setWebsiteUrl] = useState(existingProject?.websiteUrl || '');
      const [downloadUrl, setDownloadUrl] = useState(existingProject?.downloadUrl || '');
      const [techInput, setTechInput] = useState('');
      const [technologies, setTechnologies] = useState(existingProject?.technologies || []);
      const [date, setDate] = useState(
        existingProject?.date || new Date().toISOString().split('T')[0]
      );
      const [saving, setSaving] = useState(false);

      const handleThumbnailUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const ext = getFileExt(file.name);
        if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
          addToast('Invalid Thumbnail Format', 'Allowed: JPG, JPEG, PNG, WEBP, SVG', 'error');
          return;
        }
        const dataUrl = await readFileAsDataUrl(file);
        setThumbnail(dataUrl);
        addToast('Thumbnail Loaded', file.name);
      };

      const handleGalleryUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const loaded = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
            addToast('Skipped File', `${file.name} is not a supported image format.`, 'error');
            continue;
          }
          const dataUrl = await readFileAsDataUrl(file);
          loaded.push(dataUrl);
        }
        setImages((prev) => [...prev, ...loaded]);
        if (loaded.length > 0) {
          addToast('Gallery Images Added', `${loaded.length} image(s) attached.`);
        }
      };

      const handleProjectFilesUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const processed = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_FILE_EXTS.includes(ext)) {
            addToast(
              'Unsupported File Format',
              `${file.name}: Allowed formats are JPG, JPEG, PNG, WEBP, SVG, APK, ISO, PDF, DOCX, TXT, ZIP.`,
